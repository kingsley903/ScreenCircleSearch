// Top level build file for ScreenCircleSearch.
//
// Version choices are deliberately pinned to versions that are compatible with
// compileSdk 30 (Android 11) and that still work with JDK 11, which is what
// Android Gradle Plugin 7.x requires.
buildscript {
    ext {
        kotlin_version = '1.5.31'
        agp_version = '7.0.4'

        // Android SDK levels. The app compiles and targets Android 11 (API 30) but
        // runs on anything from Android 5.0 (Lollipop, API 21) upwards. Screenshots
        // are taken through MediaProjection, which is public since API 21, so we no
        // longer depend on the API 30 AccessibilityService.takeScreenshot() call.
        compile_sdk = 30
        target_sdk = 30
        min_sdk = 21
    }
}

plugins {
    id 'com.android.application' version "$agp_version" apply false
    id 'org.jetbrains.kotlin.android' version "$kotlin_version" apply false
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
