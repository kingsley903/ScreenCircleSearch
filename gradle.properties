# Project-wide Gradle settings for ScreenCircleSearch.

# JVM options for the Gradle daemon. AGP 7.0.x works best with these.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use the Gradle daemon and parallel project execution to speed up builds.
org.gradle.daemon=true
org.gradle.parallel=true

# AndroidX is required by the support libraries used here.
android.useAndroidX=true

# Only build the resources for the languages we actually ship.
android.enableR8.fullMode=false
